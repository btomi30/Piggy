<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Piggy</title>

    <!-- InkJS -->
    <script src="https://cdn.jsdelivr.net/npm/inkjs@2.3.1/dist/ink-full.js"></script>


    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f1e8;
            margin: 0;
            padding: 30px;
        }


        #game {
            max-width: 600px;
            margin: auto;

            background: white;

            padding: 30px;

            border-radius: 20px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }


        h1 {
            text-align: center;
        }


        #stats {

            display: flex;

            justify-content: space-around;

            background: #eee;

            padding: 15px;

            border-radius: 12px;

            margin-bottom: 25px;
        }


        .stat {
            text-align: center;
        }


        .number {

            font-size: 24px;

            font-weight: bold;
        }


        #story {

            font-size: 18px;

            line-height: 1.5;

            margin-bottom: 25px;
        }


        button {

            display: block;

            width: 100%;

            padding: 15px;

            margin-top: 10px;

            font-size: 17px;

            border: none;

            border-radius: 10px;

            background: #e7a4a4;

            cursor: pointer;
        }


        button:hover {
            background: #d98c8c;
        }

    </style>

</head>


<body>


<div id="game">

    <h1>🐷 Piggy</h1>


    <div id="stats">

        <div class="stat">
            🐷
            <div class="number" id="pig">?</div>
            pigs
        </div>


        <div class="stat">
            ⚖️
            <div class="number" id="pig_size">?</div>
            kg
        </div>


        <div class="stat">
            🪙
            <div class="number" id="coin">?</div>
            coins
        </div>

    </div>


    <div id="story"></div>


    <div id="choices"></div>

</div>



<script>


/*
==================================================
1. INK JSON BETÖLTÉSE
==================================================
*/

fetch("Piggy.json")

    .then(response => response.json())

    .then(json => {

        /*
        Az InkJS létrehozza a játékot
        a Piggy.json alapján.
        */

        window.story = new inkjs.Story(json);


        /*
        Elindítjuk a játékot.
        */

        play();


    })

    .catch(error => {

        console.error(error);

        document.getElementById("story").innerText =
            "Could not load Piggy.json";

    });



/*
==================================================
2. AZ INK STORY LEJÁTSZÁSA
==================================================
*/

function play() {


    /*
    Amíg az Inknek van megjelenítendő szövege,
    kiolvassuk.
    */

    let text = "";


    while (story.canContinue) {

        text += story.Continue();

    }


    /*
    Megjelenítjük a történet szövegét.
    */

    document.getElementById("story").innerText = text;


    /*
    Kiolvassuk az Ink által létrehozott
    választási lehetőségeket.
    */

    showChoices();


    /*
    Kiolvassuk az Ink változóit.
    */

    updateVariables();

}



/*
==================================================
3. VÁLASZTÁSOK MEGJELENÍTÉSE
==================================================
*/

function showChoices() {


    const choices =
        document.getElementById("choices");


    choices.innerHTML = "";


    /*
    Az Ink JSON-ban található aktuális
    choice-okból készítünk HTML gombokat.
    */

    story.currentChoices.forEach((choice, index) => {


        const button =
            document.createElement("button");


        /*
        A gomb szövegét NEM mi írjuk be.

        Az Ink JSON-ból jön.
        */

        button.innerText =
            choice.text;


        /*
        Ha megnyomják a gombot,
        visszaadjuk a választást az Inknek.
        */

        button.onclick = function() {

            story.ChooseChoiceIndex(index);

            play();

        };


        choices.appendChild(button);

    });

}



/*
==================================================
4. INK VÁLTOZÓK MEGJELENÍTÉSE
==================================================
*/

function updateVariables() {


    /*
    Ezek a változók a Piggy.json-ból jönnek.

    A JS NEM módosítja őket.
    Csak megjeleníti őket.
    */


    const pig =
        story.variablesState["pig"];


    const pigSize =
        story.variablesState["pig_size"];


    const coin =
        story.variablesState["coin"];


    document.getElementById("pig").innerText =
        pig;


    document.getElementById("pig_size").innerText =
        pigSize;


    document.getElementById("coin").innerText =
        coin;

}


</script>


</body>

</html>
