<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Piggy</title>

    <style>

        /* Az egész oldal */
        body {
            font-family: Arial, sans-serif;
            background: #f5f1e8;
            margin: 0;
            padding: 30px;
        }

        /* A játék központi ablaka */
        #game {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        /* Cím */
        h1 {
            text-align: center;
            margin-top: 0;
        }

        /* A játékos állapota */
        #stats {
            display: flex;
            justify-content: space-around;
            background: #eee;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .stat {
            text-align: center;
        }

        .number {
            font-size: 24px;
            font-weight: bold;
        }

        /* Szövegdoboz */
        #story {
            font-size: 18px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        /* Gombok */
        button {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 10px;

            font-size: 17px;

            border: none;
            border-radius: 10px;

            background: #e7a4a4;
            cursor: pointer;
        }

        button:hover {
            background: #d98c8c;
        }

    </style>
</head>


<body>

<div id="game">

    <h1>🐷 Piggy</h1>


    <!-- Játékos állapota -->

    <div id="stats">

        <div class="stat">
            🐷
            <div id="pig">0</div>
            pigs
        </div>

        <div class="stat">
            ⚖️
            <div id="pig_size">10</div>
            kg
        </div>

        <div class="stat">
            🪙
            <div id="coin">0</div>
            coins
        </div>

    </div>


    <!-- A történet szövege -->

    <div id="story">
        You are at home.
        You are a happy owner of some pigs.
    </div>


    <!-- Választási lehetőségek -->

    <div id="choices">

        <button onclick="goToMarket()">
            🏪 Market
        </button>

        <button onclick="newDay()">
            ☀️ New day
        </button>

        <button onclick="goToButcher()">
            🔪 Sell pigs
        </button>

    </div>

</div>


<script>

    /*
        ==========================
        JÁTÉK ÁLLAPOTA
        ==========================
    */

    let pig = 0;
    let pig_size = 10;
    let coin = 0;


    /*
        ==========================
        KÉPERNYŐ FRISSÍTÉSE
        ==========================
    */

    function updateScreen() {

        document.getElementById("pig").innerText = pig;

        document.getElementById("pig_size").innerText = pig_size;

        document.getElementById("coin").innerText = coin;

    }


    /*
        ==========================
        HOME
        ==========================
    */

    function home() {

        document.getElementById("story").innerText =
            "You are at home. You are a happy owner of "
            + pig
            + " pig(s) thats "
            + pig_size
            + " kg. You have "
            + coin
            + " coins.";


        document.getElementById("choices").innerHTML = `

            <button onclick="goToMarket()">
                🏪 Market
            </button>

            <button onclick="newDay()">
                ☀️ New day
            </button>

            <button onclick="goToButcher()">
                🔪 Sell pigs
            </button>

        `;

        updateScreen();
    }


    /*
        ==========================
        MARKET
        ==========================
    */

    function goToMarket() {

        document.getElementById("story").innerText =
            "Welcome to the market.";

        document.getElementById("choices").innerHTML = `

            <button onclick="buyPig()">
                🐷 Buy a pig — 5 coins
            </button>

            <button onclick="home()">
                🏠 Home
            </button>

        `;

    }


    /*
        ==========================
        DISZNÓ VÁSÁRLÁSA
        ==========================
    */

    function buyPig() {

        if (coin < 5) {

            document.getElementById("story").innerText =
                "Not enough money.";

            return;
        }


        pig = pig + 1;

        pig_size = pig_size + 1;

        coin = coin - 5;


        document.getElementById("story").innerText =
            "Bought a pig.";

        updateScreen();

    }


    /*
        ==========================
        ÚJ NAP
        ==========================
    */

    function newDay() {

        if (pig < 1) {

            document.getElementById("story").innerText =
                "You slept well.";

        } else {

            pig_size = pig_size + 1;

            coin = coin - (pig * 0.5);

            document.getElementById("story").innerText =
                "Your pigs ate and slept well.";

        }

        updateScreen();

    }


    /*
        ==========================
        BUTCHER
        ==========================
    */

    function goToButcher() {

        document.getElementById("story").innerText =
            "Welcome to the butcher.";

        document.getElementById("choices").innerHTML = `

            <button onclick="sellPigs()">
                🔪 Sell pigs
            </button>

            <button onclick="home()">
                🏠 Home
            </button>

        `;

    }


    /*
        ==========================
        ELADÁS
        ==========================
    */

    function sellPigs() {

        coin = coin + (pig_size * 2);

        pig_size = 0;

        pig = 0;


        document.getElementById("story").innerText =
            "Sold your pigs.";

        updateScreen();

    }


    /*
        ==========================
        INDULÁS
        ==========================
    */

    home();

</script>

</body>

</html>
